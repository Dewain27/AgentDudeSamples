# Build Work Estimator -- Scenario A
# Author: Dewain Robinson
#
# Harbor Line Logistics is a FICTIONAL company. Every figure is invented.
#
# BUILT WITH Claude Code, BUILT ON Copilot Studio. Two different questions,
# two different meters, both spent on this one project. Copilot Studio is
# where the agent is deployed, previewed, evaluated and validated -- the
# authoring happens in the coding agent.

project: Harbor Line Logistics -- dispatch agent
author: Dewain Robinson

reserve_percent: 25

build_platform: claude-code        # what does the building
target_platform: copilot-studio    # where it is deployed and evaluated

licensing:
  model: seat
  plan: Claude Max
  seat_monthly_cost: 200
  seats: 1
  other_workload_share: 0.45
  concentrated: true

target:
  # REQUIRED. Decides whether ANY build/test/eval work is billed.
  harness: github-copilot    # bills for building, testing and evaluating
  tier: standard
  reasoning_model: true

  # Human validation in the Copilot Studio interface. Hours are collected to
  # size the test volume -- never estimated as labour cost.
  interactive_test_hours: 16
  interactions_per_hour: 25

  # Evaluations are always planned, along with remediation and retesting.
  eval_test_cases: 40
  eval_repeats: 3
  eval_cycles: 4
  eval_tokens_per_case: 3000

  agent_flow_actions: 250

items:
  - name: Agent instructions, topics and tool definitions
    size: medium
    files: 11
    unknowns: 2
    brownfield: true

  - name: Dataverse schema and rate-card importer
    size: small
    files: 4
    unknowns: 1
    brownfield: false

  - name: Legacy AS400 field mapping research
    size: exploration
    files: 0
    unknowns: 3
    brownfield: true

  - name: Driver mobile handoff screens
    size: medium
    files: 8
    unknowns: 0
    brownfield: false
