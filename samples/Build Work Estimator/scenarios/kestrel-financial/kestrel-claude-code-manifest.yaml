# Kestrel Financial Group -- Advisor Intelligence Platform
# Run A: built with CLAUDE CODE
# Author: Dewain Robinson
#
# Kestrel Financial Group is FICTIONAL. See specification.md.
#
# This manifest and kestrel-github-copilot-manifest.yaml describe the SAME
# programme with the SAME work breakdown. They differ only in the build
# platform and its licensing. Everything on the target side is identical,
# because the target does not change when you change the tool you build with.

project: Kestrel Financial Group -- Advisor Intelligence Platform (phases 1-2)
author: Dewain Robinson

specification:
  functional: specification.md sections 1-4 (product and functional scope)
  technical: specification.md sections 5-9 (integration, Azure, data, NFRs, compliance)
  status: approved

reserve_percent: 30

build_platform: claude-code
target_platform: both          # Copilot Studio agent, Azure application

licensing:
  model: seat
  plan: Claude for Enterprise
  seat_monthly_cost: 150
  seats: 6                     # 6 engineers on the programme
  duration_months: 5
  other_workload_share: 0.30   # 30% of the allowance is other work
  concentrated: false

target:
  harness: github-copilot      # bills for building, testing and evaluating
  tier: standard
  reasoning_model: true        # required by the suitability/disclosure logic

  # Human validation in the Copilot Studio interface (specification s12).
  # Collected to size interactive test volume; never priced as labour.
  interactive_test_hours: 96
  interactions_per_hour: 25

  # Evaluation strategy (specification s11): 568 cases x 3 repeats.
  # Six cycles: two to converge, two for compliance findings, two for
  # regression after remediation.
  eval_test_cases: 568
  eval_repeats: 3
  eval_cycles: 6
  eval_tokens_per_case: 3500

  agent_flow_actions: 1200

  # Azure build-and-test consumption across dev, test and staging for the
  # ~5 month programme. Runtime is explicitly out of scope.
  azure_components:
    - name: App Service and Functions (dev/test/staging)
      usd: 2400
      note: Linux plans, Functions Premium with VNet integration
    - name: Cosmos DB (three environments)
      usd: 3100
      note: conversation, audit and disclosure containers
    - name: Azure AI Search with semantic ranking
      usd: 4200
      note: five knowledge indexes, reindexing during build
    - name: API Management
      usd: 2800
      note: developer tier in lower envs, standard in staging
    - name: Service Bus, Storage, Key Vault
      usd: 900
      note: includes immutable archive staging
    - name: Observability ingestion
      usd: 1600
      note: App Insights and Log Analytics during build and test
    - name: Front Door and networking
      usd: 1100
      note: private endpoints, private DNS, hub-spoke peering

