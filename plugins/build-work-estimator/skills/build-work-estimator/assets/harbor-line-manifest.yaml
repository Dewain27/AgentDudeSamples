# Build Work Estimator -- Scenario A: building WITH Claude Code
# Author: Dewain Robinson
#
# Harbor Line Logistics is a FICTIONAL company. Every figure is invented.
#
# NOTE WHAT THIS DEMONSTRATES: the thing being built is a Microsoft workload --
# a Copilot Studio dispatch agent -- but the BUILD is done in Claude Code.
# The currency follows the build stack, so this is metered in tokens, not
# Copilot Credits. Building a Microsoft workload does not make it a Microsoft
# build.

project: Harbor Line Logistics -- Copilot Studio dispatch agent, built in Claude Code
author: Dewain Robinson

# REQUIRED. No default.
reserve_percent: 25

# What we BUILD WITH. Not what we build FOR.
build_stack: claude-code

licensing:
  model: seat                 # seat | consumption
  plan: Claude Max
  seat_monthly_cost: 200      # REQUIRED for seat -- a seat is not free
  seats: 1
  other_workload_share: 0.45  # 45% of the allowance already spoken for
  concentrated: true          # compressed into a short delivery window

items:
  - name: Agent topic + tool authoring
    size: medium
    files: 11
    unknowns: 2
    brownfield: true

  - name: Dataverse schema and rate-card importer
    size: small
    files: 4
    unknowns: 1
    brownfield: false

  - name: Legacy AS400 field mapping research
    size: exploration
    files: 0
    unknowns: 3
    brownfield: true

  - name: Driver mobile handoff screens
    size: medium
    files: 8
    unknowns: 0
    brownfield: false
